<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#4a2c0a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="암석탐구"/>
<title>🪨 산행 암석 탐구</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(135deg,#f5f0e8,#e8d5b0);min-height:100vh;font-family:'Segoe UI',sans-serif;padding:16px;}
.wrap{max-width:520px;margin:0 auto;}
.hdr{text-align:center;margin-bottom:20px;}
.hdr h1{font-size:22px;font-weight:800;color:#4a2c0a;margin:6px 0 2px;}
.hdr p{font-size:13px;color:#8a6a3a;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.card-title{font-weight:700;font-size:14px;color:#5a3e1b;margin-bottom:12px;border-bottom:2px solid #e8d5b0;padding-bottom:6px;}
input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #d4b896;font-size:14px;outline:none;background:#fdfaf5;}
.upload-box{border:2px dashed #c4a06a;border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#fdfaf5;}
.btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;display:block;}
.btn-green{background:linear-gradient(135deg,#6b8f4a,#4a7c2f);color:#fff;}
.btn-gold{padding:14px;border-radius:10px;font-size:16px;background:linear-gradient(135deg,#8B6914,#c4a035);color:#fff;box-shadow:0 4px 12px rgba(139,105,20,.3);margin-top:4px;}
.btn-reset{background:linear-gradient(135deg,#4a7c2f,#6b8f4a);color:#fff;padding:13px;border-radius:10px;font-size:15px;margin-top:4px;}
.err{color:#c0392b;background:#fdecea;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;}
.result-hdr{background:linear-gradient(135deg,#4a2c0a,#8B6914);border-radius:14px;padding:18px;margin-bottom:14px;color:#fff;text-align:center;}
.rname{font-size:26px;font-weight:800;}
.ename{font-size:15px;opacity:.85;margin-top:2px;}
.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;margin-top:10px;border:3px solid rgba(255,255,255,.4);}
table{width:100%;border-collapse:collapse;font-size:13px;}
td{padding:6px 10px;border-bottom:1px solid #ede0c8;}
.td-k{font-weight:600;color:#6b4c1e;width:38%;}
tr:nth-child(even){background:#fdf8f0;}
.chem-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.chem-item{border-radius:8px;padding:7px 10px;display:flex;justify-content:space-between;border:1px solid #ede0c8;}
.chem-item:nth-child(odd){background:#fdf8f0;}
.chem-item:nth-child(even){background:#f5ead6;}
.chem-k{font-weight:700;font-size:12px;color:#6b4c1e;}
.chem-v{font-size:13px;color:#333;font-weight:600;}
.dist-wrap{display:flex;flex-wrap:wrap;gap:7px;}
.dist-tag{background:#f0e6cc;color:#6b4c1e;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.gps-box{display:flex;flex-direction:column;gap:8px;}
.gps-info{font-size:13px;color:#4a2c0a;background:#fdf8f0;border:1px solid #ede0c8;border-radius:8px;padding:10px;line-height:1.5;}
.gauge-container{background:#e2d8c5;border-radius:10px;height:14px;overflow:hidden;position:relative;margin:8px 0;}
.gauge-bar{background:linear-gradient(90deg, #c4a035, #8B6914);height:100%;border-radius:10px;transition:width 0.5s ease-in-out;}
.gauge-label{display:flex;justify-content:space-between;font-size:12px;font-weight:bold;color:#5a3e1b;}
.flex-align{display:flex;align-items:center;gap:6px;}
.offline-banner{background:linear-gradient(135deg, #d35400, #e67e22);color:white;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:700;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.15);}
.history-item{background:#fdfaf5;border:1.5px solid #d4b896;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:between;align-items:center;cursor:pointer;transition:background 0.2s;}
.history-item:hover{background:#f5ead6;}
.history-name{font-weight:700;color:#4a2c0a;}
.history-date{font-size:11px;color:#8a6a3a;}
.cam-container{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#000;}
.cam-container video{width:100%;display:block;}
.cam-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.focus-target{width:70px;height:70px;border:2px dashed rgba(255,255,255,0.7);border-radius:50%;position:relative;animation:pulse 2s infinite;}
.focus-target::before, .focus-target::after{content:'';position:absolute;background:rgba(255,255,255,0.7);}
.focus-target::before{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%);}
.focus-target::after{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);}
@keyframes pulse{0%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.08);opacity:0.95;}100%{transform:scale(1);opacity:0.6;}}
.zoom-box{background:rgba(74,44,10,0.85);border-radius:8px;padding:8px 12px;margin:6px 0;display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;font-weight:700;}
.zoom-slider{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,0.3);outline:none;-webkit-appearance:none;}
.zoom-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#ede0c8;cursor:pointer;border:2px solid #8B6914;}
.cam-btns{display:flex;gap:8px;margin-top:8px;}
.cam-btns button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:14px;}
.hidden{display:none;}
canvas{display:none;}

/* 스켈레톤 로딩 UI 스타일 */
.skeleton-header{background:#ede0c8;height:120px;border-radius:14px;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.skeleton-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.skeleton-shimmer{background:linear-gradient(90deg, #e4d5be 25%, #f4e8d3 50%, #e4d5be 75%);background-size:200% 100%;animation:shimmer-anim 1.5s infinite;border-radius:6px;}
@keyframes shimmer-anim{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skeleton-title{height:18px;width:35%;margin-bottom:14px;}
.skeleton-line{height:12px;width:100%;margin-bottom:8px;}
.skeleton-line.short{width:60%;}
.skeleton-circle{width:90px;height:90px;border-radius:50%;margin:12px auto 6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div style="font-size:40px">🪨</div>
    <h1>산행 암석 탐구</h1>
    <p>이름 입력 · 이미지 업로드 · 카메라 촬영</p>
  </div>

  <!-- 오프라인 알림 배너 -->
  <div id="offlineBanner" class="offline-banner hidden">
    📡 오프라인 상태입니다. 보관된 이전 분석 기록과 기본 도감(6종)만 즉시 열람 가능합니다.
  </div>

  <!-- 입력 화면 -->
  <div id="inputView">
    <div class="card" id="apiCard">
      <div class="card-title">🔑 Gemini API 키</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="flex:1;padding:10px 12px;border-radius:8px;border:1.5px solid #d4b896;font-size:13px;outline:none;background:#fdfaf5;"/>
        <button onclick="saveKey()" style="padding:10px 14px;border-radius:8px;border:none;background:#8B6914;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px;">저장</button>
      </div>
      <div id="keyStatus" style="font-size:11px;color:#8a6a3a;margin-top:6px"></div>
      <div style="font-size:11px;color:#aaa;margin-top:4px">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#8B6914">aistudio.google.com</a>에서 발급 · 이 기기에만 저장됩니다
      </div>
    </div>

    <div class="card">
      <div class="card-title">📍 탐구 위치 설정 (선택사항)</div>
      <div class="gps-box">
        <button class="btn btn-green" onclick="getGPSLocation()" id="gpsBtn">📍 현재 위치 가져오기</button>
        <div id="gpsStatus" class="gps-info hidden"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">① 암석 이름 입력</div>
      <input type="text" id="rockInput" placeholder="예: 화강암, granite, 현무암..."/>
    </div>

    <div class="card">
      <div class="card-title">② 이미지 업로드</div>
      <div class="upload-box" id="uploadBox">
        <div id="uploadPlaceholder">
          <div style="font-size:32px">📁</div>
          <div style="font-size:13px;color:#8a6a3a;margin-top:6px">클릭하여 이미지 선택<br/><small style="font-size:11px;color:#b8946a">JPG, PNG, WEBP 지원</small></div>
        </div>
        <img id="uploadPreview" class="hidden" style="max-width:100%;max-height:180px;border-radius:8px;"/>
      </div>
      <input type="file" id="fileInput" accept="image/*" class="hidden"/>
    </div>

    <div class="card">
      <div class="card-title">③ 카메라 촬영</div>
      <div id="camOff">
        <button class="btn btn-green" onclick="startCam()">📷 카메라 열기</button>
      </div>
      <div id="camOn" class="hidden">
        <div class="cam-container">
          <video id="video" autoplay playsinline></video>
          <div class="cam-overlay">
            <div class="focus-target"></div>
            <div style="position: absolute; bottom: 8px; color: rgba(255,255,255,0.75); font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); font-weight: bold;">과녁에 결정을 조준하세요</div>
          </div>
        </div>
        <div class="zoom-box" id="zoomControlBox">
          <span>🔍 줌</span>
          <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="setZoom(this.value)"/>
          <span id="zoomVal" style="min-width: 35px; text-align: right;">1.0x</span>
        </div>
        <canvas id="canvas"></canvas>
        <div class="cam-btns">
          <button style="background:#4a7c2f;color:#fff;" onclick="capture()">📸 촬영</button>
          <button style="background:#999;color:#fff;" onclick="stopCam()">✕ 취소</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📜 저장된 분석 기록 & 기본 도감</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-green" onclick="toggleHistoryList()" id="historyTabBtn" style="flex:1; padding:8px 6px; font-size:12.5px;">📜 분석 기록 (0)</button>
        <button class="btn btn-green" onclick="toggleOfflineDict()" id="dictTabBtn" style="flex:1; padding:8px 6px; font-size:12.5px;">📖 기본 도감 (6종)</button>
      </div>
      <div id="localListArea" class="hidden" style="max-height:220px; overflow-y:auto; margin-top:10px; border-top: 1px solid #ede0c8; padding-top:10px;"></div>
    </div>

    <div id="errBox" class="err hidden"></div>
    <button class="btn btn-gold" id="analyzeBtn" onclick="analyze()">🔍 암석 분석하기</button>
  </div>

  <!-- 결과 화면 -->
  <div id="resultView" class="hidden"></div>
</div>

<script defer src="./dist/app.js"></script>
</body>
</html>
